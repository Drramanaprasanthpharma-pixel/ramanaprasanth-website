<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Ramanaprasanth | Clinical Pharmacist</title>

<style>
  :root{
    --violet:#2d1b69;
    --indigo:#180f3e;
    --cyan:#00e5ff;
    --magenta:#ff3fa4;
    --gold:#ffcc33;
    --mint:#3dffc0;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.14);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:#f1eefc;
    background: radial-gradient(circle at 20% 10%, #3a1f7a 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, #7a1fae 0%, transparent 40%),
                radial-gradient(circle at 50% 90%, #0f7a8c 0%, transparent 45%),
                linear-gradient(160deg, var(--indigo), #0a0620 70%);
    background-attachment: fixed;
    overflow-x:hidden;
  }

  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; margin:0; }

  /* ---------- Floating 3D orbs (ambient) ---------- */
  .orb{
    position:fixed;
    border-radius:50%;
    filter: blur(2px);
    opacity:0.55;
    z-index:0;
    pointer-events:none;
    animation: float 9s ease-in-out infinite;
  }
  .orb1{ width:120px; height:120px; top:8%; left:6%;
    background: radial-gradient(circle at 30% 30%, var(--cyan), #003b47 75%);
    box-shadow:0 0 60px var(--cyan); animation-delay:0s; }
  .orb2{ width:90px; height:90px; top:65%; left:88%;
    background: radial-gradient(circle at 30% 30%, var(--magenta), #4a0030 75%);
    box-shadow:0 0 60px var(--magenta); animation-delay:2s; }
  .orb3{ width:70px; height:70px; top:80%; left:10%;
    background: radial-gradient(circle at 30% 30%, var(--gold), #4a3900 75%);
    box-shadow:0 0 50px var(--gold); animation-delay:4s; }
  .orb4{ width:55px; height:55px; top:15%; left:80%;
    background: radial-gradient(circle at 30% 30%, var(--mint), #003a2b 75%);
    box-shadow:0 0 40px var(--mint); animation-delay:1s; }

  @keyframes float{
    0%,100%{ transform:translateY(0) translateX(0) rotate(0deg); }
    50%{ transform:translateY(-35px) translateX(15px) rotate(12deg); }
  }

  /* ---------- Header / Hero ---------- */
  header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:100px 20px 70px;
    perspective:1000px;
  }

  .capsule-wrap{
    width:130px; height:130px;
    margin:0 auto 30px;
    perspective:800px;
  }
  .capsule{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    animation: spin 7s linear infinite;
  }
  .capsule-face{
    position:absolute; inset:0;
    border-radius:50%;
    background: conic-gradient(from 90deg, var(--cyan), var(--magenta), var(--gold), var(--mint), var(--cyan));
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 0 40px rgba(255,255,255,0.25);
  }
  .capsule-face.back{ transform: rotateY(180deg); }
  .capsule-ring{
    position:absolute; inset:-10px;
    border-radius:50%;
    border:2px dashed rgba(255,255,255,0.35);
    transform: rotateX(75deg);
  }

  @keyframes spin{
    from{ transform: rotateY(0deg) rotateX(8deg); }
    to{ transform: rotateY(360deg) rotateX(8deg); }
  }

  header h1{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    background: linear-gradient(90deg, var(--cyan), var(--mint), var(--gold), var(--magenta));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 10px 40px rgba(0,229,255,0.25);
    letter-spacing:0.5px;
  }
  header h3{
    margin-top:14px;
    font-weight:500;
    color:#c9c3f0;
    font-size:1.15rem;
  }

  /* ---------- Nav ---------- */
  nav{
    position:sticky; top:0; z-index:10;
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:16px 10px;
    background: rgba(15,8,40,0.55);

</body>
</html>
